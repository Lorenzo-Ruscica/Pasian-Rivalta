<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pasian Rivalta – Logo Oro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #020202;
      --gold-solid: #d4af37;
      --glass-border: rgba(212,175,55,.25);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg-dark);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 3rem 1rem;
    }
    .logo-card {
      background: rgba(10,10,10,.9);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 4rem 5rem;
      box-shadow: 0 0 60px rgba(212,175,55,.12), 0 20px 60px rgba(0,0,0,.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-wrapper {
      position: relative;
      display: inline-block;
      width: 500px;
      max-width: 88vw;
    }
    /* Immagine con invert solo per l'anteprima visiva */
    .logo-img {
      display: block;
      width: 100%;
      height: auto;
      filter: invert(1);
    }
    .gold-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
        #bf953f  0%,
        #fcf6ba 30%,
        #d4af37 55%,
        #b38728 80%,
        #aa771c 100%
      );
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .btn-row {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      padding: .9rem 2.2rem;
      border-radius: 50px;
      border: 1px solid var(--gold-solid);
      background: transparent;
      color: var(--gold-solid);
      font-family: 'Montserrat', sans-serif;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .4s ease;
    }
    .btn-download:hover {
      background: var(--gold-solid);
      color: #000;
      box-shadow: 0 0 30px rgba(212,175,55,.45);
      transform: translateY(-3px);
    }
    .btn-download svg { width:16px; height:16px; fill:currentColor; flex-shrink:0; }
    .note { color: rgba(212,175,55,.45); font-size:.72rem; text-align:center; }
  </style>
</head>
<body>

    function goldColor(t) {
      const stops = [
        [0,    191, 149,  63],
        [0.30, 252, 246, 186],
        [0.55, 212, 175,  55],
        [0.80, 179, 135,  40],
        [1.00, 170, 119,  28],
      ];
      let a = stops[0], b = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) {
        if (t >= stops[i][0] && t <= stops[i+1][0]) {
          a = stops[i]; b = stops[i+1]; break;
        }
      }
      const f = (a[0] === b[0]) ? 0 : (t - a[0]) / (b[0] - a[0]);
      return [
        Math.round(a[1] + (b[1] - a[1]) * f),
        Math.round(a[2] + (b[2] - a[2]) * f),
        Math.round(a[3] + (b[3] - a[3]) * f),
      ];
    }

    function scarica(sfondo) {
      const SCALE = 4;

      // Crea una nuova immagine JS senza nessun filtro CSS applicato
      // Questo garantisce che il canvas legga i pixel ORIGINALI (nero su bianco)
      const rawImg = new Image();
      rawImg.onload = function() {
        const W = rawImg.naturalWidth  * SCALE;
        const H = rawImg.naturalHeight * SCALE;

        const canvas = document.getElementById('offscreen');
        canvas.width  = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        // Disegna il logo originale sul canvas (SENZA filtri CSS)
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(rawImg, 0, 0, W, H);

        const id = ctx.getImageData(0, 0, W, H);
        const d  = id.data;

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const idx = (y * W + x) * 4;
            const r = d[idx], g = d[idx+1], b = d[idx+2];

            // Luminosità: 0 = nero (logo), 255 = bianco (sfondo)
            const lum = r * 0.299 + g * 0.587 + b * 0.114;

            // Posizione nel gradiente oro (diagonale 135°)
            const t = Math.min(1, Math.max(0, (x / W * 0.7 + y / H * 0.3)));
            const [gr, gg, gb] = goldColor(t);

            // Alpha basata sulla scurezza del pixel originale
            // Nero (lum=0)   → alpha=255 (oro pieno)
            // Bianco (lum=255) → alpha=0 (trasparente)
            const alpha = Math.max(0, Math.min(255, Math.round(255 - lum)));

            if (sfondo === 'trasparente') {
              d[idx]   = gr;
              d[idx+1] = gg;
              d[idx+2] = gb;
              d[idx+3] = alpha;
            } else {
              // Sfondo scuro: componi oro su #020202
              const a = alpha / 255;
              d[idx]   = Math.round(gr * a + 2 * (1 - a));
              d[idx+1] = Math.round(gg * a + 2 * (1 - a));
              d[idx+2] = Math.round(gb * a + 2 * (1 - a));
              d[idx+3] = 255;
            }
          }
        }

        ctx.putImageData(id, 0, 0);

        const nome = sfondo === 'trasparente'
          ? 'pasian-rivalta-logo-gold-trasparente.png'
          : 'pasian-rivalta-logo-gold-scuro.png';

        const a = document.createElement('a');
        a.download = nome;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      // Carica il logo originale in un oggetto Image puro (senza filtri CSS)
      rawImg.src = LOGO_SRC;
    }
